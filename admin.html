<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅间 · 管理后台</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><aside><div class="brand"><b>阅</b><span>阅间<small>ADMIN CONSOLE</small></span></div><nav><button class="active" data-panel="overview">▦　运营总览</button><button data-panel="reservations">▤　预约管理</button><button data-panel="rooms">▥　阅览室与座位</button><button data-panel="users">♙　用户与信用</button></nav><div class="aside-foot">管理员账号<br><strong id="admin-name">未登录</strong></div></aside><main><header><div><small>LIBRARY MANAGEMENT SYSTEM</small><h1 id="panel-title">运营总览</h1></div><button class="logout" id="logout">退出后台</button></header><div id="login" class="login-card"><h2>管理员登录</h2><p>使用管理账号进入阅间后台。</p><input id="login-user" placeholder="管理员账号" value="admin"><input id="login-pass" type="password" placeholder="密码" value="admin123"><button class="primary" id="login-btn">登录后台</button><div id="login-error"></div></div><div id="app" hidden><section id="overview" class="panel active"><div class="metric-grid"><div><span>今日预约</span><b id="m-reserve">0</b><small>条预约记录</small></div><div><span>座位使用率</span><b id="m-usage">0%</b><small>按当前状态计算</small></div><div><span>待处理违约</span><b id="m-violation">0</b><small>需要关注</small></div><div><span>开放阅览室</span><b id="m-room">0</b><small>个阅览室</small></div></div><div class="content-card"><div class="card-title"><b>实时预约动态</b><button class="refresh" id="refresh">刷新数据</button></div><div id="recent-list"></div></div></section><section id="reservations" class="panel"><div class="content-card"><div class="card-title"><b>预约记录</b><input id="search" placeholder="搜索学号、座位或日期"></div><div class="table-wrap"><table><thead><tr><th>学生</th><th>座位</th><th>日期 / 时间</th><th>偏好</th><th>状态</th><th>操作</th></tr></thead><tbody id="reservation-table"></tbody></table></div></div></section><section id="rooms" class="panel"><div class="content-card"><div class="card-title"><b>阅览室管理</b><span class="hint">点击状态可切换开放/暂停</span></div><div id="room-list"></div></div><div class="content-card"><div class="card-title"><b>座位状态</b><span class="hint">用于快速维护维修座位</span></div><div class="seat-admin" id="seat-list"></div></div></section><section id="users" class="panel"><div class="content-card"><div class="card-title"><b>用户与信用</b></div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>账号</th><th>角色</th><th>信用分</th></tr></thead><tbody id="user-table"></tbody></table></div></div></section></div></main></div><script src="admin.js"></script></body></html>
